# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: scripts/ai/with-node.sh npx --no -- commitlint --edit {1}

# Validate content before committing
pre-commit:
  jobs:
    - name: ultracite
      run: scripts/ai/with-node.sh npx ultracite fix --type-aware --type-check
      glob:
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.json'
        - '**/*.jsonc'
        - '**/*.css'
      stage_fixed: true
    - name: knip
      run: scripts/ai/with-node.sh npm run check:deps
      glob: '*'
